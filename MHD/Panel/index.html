<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIMT BUSE Matrix Station - LED Tečky & Čtverečky</title>
    <style>
        :root {
            --buse-color: #ff9d00;
            --ui-bg: #141414;
            --sidebar-bg: #1c1c1c;
            --panel-bg: #000000;
            --input-bg: #090909;
            --border-color: #2f2f2f;
            --accent-cyan: #00ffcc;
            --danger-color: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        header {
            background: #1a1a1a;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .simt-brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .simt-logo {
            font-weight: 900;
            color: var(--buse-color);
            border: 2px solid var(--buse-color);
            padding: 4px 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.4);
            font-size: 14px;
        }

        .control-group-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .control-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--input-bg);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .control-box label {
            font-weight: 700;
            color: #8892b0;
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }

        .control-box-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select, input[type="number"], input[type="color"], input[type="range"] {
            background: #000000;
            color: #ffffff;
            border: 1px solid #3c3c3c;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        input[type="range"] {
            padding: 0;
            cursor: pointer;
            width: 80px;
        }
        
        select {
            cursor: pointer;
            height: 26px;
        }

        input[type="color"] {
            width: 34px;
            height: 24px;
            cursor: pointer;
            padding: 0;
        }

        #toolStatus {
            font-weight: bold;
            color: var(--accent-cyan);
            margin-left: auto;
            background: #001a14;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #004d3d;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .main-workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            background: #0f0f0f;
        }

        #viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: auto;
            background: radial-gradient(circle, #202020 0%, #030303 100%);
        }

        .buse-frame {
            position: relative;
            border: 16px solid #282828;
            border-top-color: #333333;
            border-bottom-color: #1e1e1e;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.7);
            background: #000000;
            padding: 4px;
            border-radius: 6px;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .sidebar-layers {
            width: 280px;
            background: var(--sidebar-bg);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0aec0;
            margin-bottom: 12px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .layer-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .layer-item {
            background: #121212;
            border: 1px solid #2d2d2d;
            border-radius: 4px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
        }

        .layer-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .layer-color-indicator {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid #555;
        }

        .btn-delete-layer {
            background: transparent;
            color: var(--danger-color);
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            padding: 0 4px;
        }

        .no-layers-placeholder {
            color: #4a5568;
            font-style: italic;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
        }

        footer {
            background: var(--ui-bg);
            border-top: 2px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -10px 35px rgba(0,0,0,0.8);
            z-index: 5;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 110px 2fr 60px 110px 80px 130px;
            gap: 12px;
            align-items: center;
        }

        .grid-header {
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            color: #718096;
            letter-spacing: 1px;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 4px;
        }

        .editor-grid input[type="text"] {
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 5px;
            background: #000000;
            color: #ffffff;
            border: 1px solid #3a3a3a;
            width: 100%;
        }
        
        .editor-grid input[type="text"]:focus {
            border-color: var(--buse-color);
            outline: none;
        }

        .label-tag {
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            color: #cbd5e0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .coordinate-inputs {
            display: flex;
            gap: 6px;
        }

        .coordinate-inputs div {
            display: flex;
            align-items: center;
            background: #000000;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            padding: 2px 5px;
        }

        .coordinate-inputs span {
            font-size: 10px;
            color: #555;
            margin-right: 3px;
            font-weight: bold;
        }

        .coordinate-inputs input {
            border: none !important;
            background: transparent !important;
            width: 30px;
            padding: 2px 0;
            text-align: center;
            color: #fff;
            font-size: 12px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 5px;
            align-items: center;
        }

        button.action-btn {
            flex: 1;
            padding: 12px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .btn-refresh { background: var(--buse-color); color: #000000; }
        .btn-clear { background: #4a1515; color: #ffffff; border: 1px solid #631c1c; }
        .btn-save { background: #2d3748; color: #ffffff; border: 1px solid #4a5568; }

        @media (max-width: 1024px) {
            .main-workspace { flex-direction: column; }
            .sidebar-layers { width: 100%; height: 150px; border-left: none; border-top: 2px solid var(--border-color); }
            .editor-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .grid-header { display: none; }
            body { overflow-y: auto; height: auto; }
        }
    </style>
</head>
<body>

<header>
    <div class="simt-brand-container">
        <div class="simt-logo">SIMT BUSE</div>
    </div>
    
    <div class="control-group-wrapper">
        <div class="control-box">
            <label for="pDotShape">Tvar diod:</label>
            <select id="pDotShape">
                <option value="circle" selected>⚫ Tečky (Kruhové LED)</option>
                <option value="square">⬛ Čtverečky (Pixel)</option>
            </select>
        </div>

        <div class="control-box">
            <label for="pWidth">Šířka panelu (px):</label>
            <input type="number" id="pWidth" value="140" min="10" max="400" style="width: 60px;">
        </div>
        
        <div class="control-box">
            <label for="pHeight">Výška panelu (px):</label>
            <input type="number" id="pHeight" value="19" min="5" max="120" style="width: 55px;">
        </div>

        <div class="control-box">
            <label for="pFontCategory">Rozvržení 2 řádků:</label>
            <select id="pFontCategory">
                <option value="custom">-- Manuální úprava --</option>
                <option value="max">1 Velký řádek</option>
                <option value="mid" selected>2 Řádky (Klasický BUSE)</option>
                <option value="big">Dominantní 1. řádek</option>
                <option value="small">Kompaktní 2 řádky</option>
            </select>
        </div>

        <div class="control-box">
            <label for="pAlphaThreshold">Citlivost vykreslení:</label>
            <div class="control-box-row">
                <input type="range" id="pAlphaThreshold" min="5" max="240" value="25">
                <span id="alphaValDisplay" style="font-size:10px; font-family:monospace; width:20px;">25</span>
            </div>
        </div>

        <div class="control-box">
            <label for="pColor">Hlavní barva LED:</label>
            <input type="color" id="pColor" value="#ff9d00">
        </div>

        <div class="control-box">
            <label for="pFill">Pozadí panelu:</label>
            <input type="color" id="pFill" value="#000000">
        </div>

        <div class="control-box">
            <label for="pRectColor">Barva ruční výplně:</label>
            <input type="color" id="pRectColor" value="#22c55e">
        </div>
    </div>

    <div id="toolStatus">Nástroj: Urči Roh 1 kliknutím do matice</div>
</header>

<div class="main-workspace">
    <div id="viewport">
        <div class="buse-frame">
            <canvas id="buseCanvas"></canvas>
        </div>
    </div>

    <div class="sidebar-layers">
        <div class="sidebar-title">
            <span>Ruční výplně podkladu</span>
            <span id="layerCount" style="color:var(--buse-color)">0</span>
        </div>
        <div class="layer-list" id="layerListContainer">
            <div class="no-layers-placeholder">Žádné ruční výplně. Kliknutím na 2 rohy v panelu vytvoříš podklad.</div>
        </div>
    </div>
</div>

<footer>
    <div class="editor-grid">
        <div class="grid-header">Prvek</div>
        <div class="grid-header">Textový obsah (Kód: [vyluka])</div>
        <div class="grid-header">Barva</div>
        <div class="grid-header">Styl písma</div>
        <div class="grid-header">Velikost (px)</div>
        <div class="grid-header">Odsazení (X / Y)</div>
    </div>

    <div class="editor-grid">
        <span class="label-tag" style="color: var(--buse-color);">📟 Linka:</span>
        <input type="text" id="lineIn" value="24">
        <input type="color" id="lineColor" value="#ff9d00">
        <select id="lineFont">
            <option value="sans-serif" selected>Sans-Serif Bold</option>
            <option value="monospace">Monospace</option>
            <option value="serif">Serif Pro</option>
            <option value="impact">Impact Style</option>
        </select>
        <input type="number" id="lineSize" value="15" min="4" max="120">
        <div class="coordinate-inputs">
            <div><span>X</span><input type="number" id="lineX" value="2"></div>
            <div><span>Y</span><input type="number" id="lineY" value="1"></div>
        </div>
    </div>

    <div class="editor-grid">
        <span class="label-tag">🔤 1. Řádek:</span>
        <input type="text" id="textIn1" value="[vyluka] HLAVNÍ NÁDRAŽÍ">
        <input type="color" id="text1Color" value="#ff9d00">
        <select id="text1Font">
            <option value="sans-serif" selected>Sans-Serif Bold</option>
            <option value="monospace">Monospace</option>
            <option value="serif">Serif Pro</option>
            <option value="impact">Impact Style</option>
        </select>
        <input type="number" id="text1Size" value="9" min="4" max="120">
        <div class="coordinate-inputs">
            <div><span>X</span><input type="number" id="text1X" value="34"></div>
            <div><span>Y</span><input type="number" id="text1Y" value="0"></div>
        </div>
    </div>

    <div class="editor-grid">
        <span class="label-tag">🔤 2. Řádek:</span>
        <input type="text" id="textIn2" value="přes VOZOVNA MATICE">
        <input type="color" id="text2Color" value="#ff9d00">
        <select id="text2Font">
            <option value="sans-serif" selected>Sans-Serif Bold</option>
            <option value="monospace">Monospace</option>
            <option value="serif">Serif Pro</option>
            <option value="impact">Impact Style</option>
        </select>
        <input type="number" id="text2Size" value="9" min="0" max="120">
        <div class="coordinate-inputs">
            <div><span>X</span><input type="number" id="text2X" value="34"></div>
            <div><span>Y</span><input type="number" id="text2Y" value="9"></div>
        </div>
    </div>

    <div class="button-group">
        <button class="action-btn btn-refresh" onclick="drawBuse()">Obnovit matici</button>
        <button class="action-btn btn-clear" onclick="clearCustomRects()">Smazat výplně</button>
        <button class="action-btn btn-save" onclick="exportPNG()">Exportovat .PNG</button>
    </div>
</footer>

<script>
const mainCanvas = document.getElementById('buseCanvas');
const mainCtx = mainCanvas.getContext('2d');
const DOT_RENDER_SIZE = 6; // Rozteč pro jemné rozlišení teček

const memoryBuffer = document.createElement('canvas');
const memCtx = memoryBuffer.getContext('2d');

const layerCanvas = document.createElement('canvas');
const lCtx = layerCanvas.getContext('2d');

let customRectsArray = [];
let firstCornerCoords = null;

/**
 * Vykreslování textu s podporou pouze [vyluka]
 */
function drawBuseTextWithCustomSymbols(ctx, text, startX, startY, fontSize, fontFamily) {
    ctx.textBaseline = "top"; 
    ctx.textAlign = "left";
    ctx.font = `bold ${fontSize}px ${fontFamily}, -apple-system, sans-serif`;
    ctx.fillStyle = "#ffffff";

    let currentX = startX;
    let regex = /(\[vyluka\])/gi;
    let segments = text.split(regex);
    
    segments.forEach((segment) => {
        let tagUpper = segment.toUpperCase();

        /* --- JEDINÝ SPECIÁLNÍ KÓD: [VYLUKA] --- */
        if (tagUpper === '[VYLUKA]') {
            let h = fontSize;
            let cx = currentX + h / 2;
            let cy = startY + h / 2;
            let r = h * 0.45;

            ctx.save();
            ctx.fillStyle = "#ffffff";
            
            // Trojúhelník
            ctx.beginPath();
            ctx.moveTo(cx, cy - r);
            ctx.lineTo(cx + r * 0.9, cy + r * 0.9);
            ctx.lineTo(cx - r * 0.9, cy + r * 0.9);
            ctx.closePath();
            ctx.fill();

            // Vykřičník uvnitř
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.fillRect(cx - h * 0.06, cy - r * 0.3, h * 0.12, r * 0.7);
            ctx.arc(cx, cy + r * 0.65, h * 0.07, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
            currentX += h + 3;
        }
        else if (segment.length > 0) {
            ctx.fillText(segment, currentX, startY);
            currentX += ctx.measureText(segment).width;
        }
    });
}

function calculateGridHoleColor(hexBgColor) {
    let r = parseInt(hexBgColor.slice(1, 3), 16);
    let g = parseInt(hexBgColor.slice(3, 5), 16);
    let b = parseInt(hexBgColor.slice(5, 7), 16);
    let luma = 0.299 * r + 0.587 * g + 0.114 * b;
    return luma < 110 ? `rgb(${r + 15}, ${g + 15}, ${b + 15})` : `rgb(${Math.max(0, r - 35)}, ${Math.max(0, g - 35)}, ${Math.max(0, b - 35)})`;
}

/**
 * Pomocná funkce pro kreslení jednotného pixelu/tečky
 */
function drawSingleLedDot(ctx, gridX, gridY, dotSize, color, shape, isGlowing) {
    const posX = gridX * dotSize;
    const posY = gridY * dotSize;
    const padding = 1; // Mezera mezi diodami
    const activeSize = dotSize - padding;

    ctx.fillStyle = color;
    
    if (isGlowing && color !== "#000000") {
        ctx.shadowBlur = dotSize * 0.7;
        ctx.shadowColor = color;
    } else {
        ctx.shadowBlur = 0;
    }

    if (shape === 'circle') {
        const radius = activeSize / 2;
        ctx.beginPath();
        ctx.arc(posX + radius, posY + radius, radius, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.fillRect(posX, posY, activeSize, activeSize);
    }
    ctx.shadowBlur = 0;
}

function applyFontPresetCategory() {
    const presetType = document.getElementById('pFontCategory').value;
    const currentPanelH = parseInt(document.getElementById('pHeight').value) || 19;
    
    if (presetType === 'custom') return;

    const sizeL = document.getElementById('lineSize');
    const xL = document.getElementById('lineX'); const yL = document.getElementById('lineY');
    const size1 = document.getElementById('text1Size');
    const x1 = document.getElementById('text1X'); const y1 = document.getElementById('text1Y');
    const size2 = document.getElementById('text2Size');
    const x2 = document.getElementById('text2X'); const y2 = document.getElementById('text2Y');

    switch (presetType) {
        case 'max':
            sizeL.value = Math.floor(currentPanelH * 0.85); xL.value = 2; yL.value = 1;
            size1.value = Math.floor(currentPanelH * 0.85); x1.value = 34; y1.value = 1;
            size2.value = 0; x2.value = 34; y2.value = 0;
            break;
        case 'big':
            sizeL.value = Math.floor(currentPanelH * 0.85); xL.value = 2; yL.value = 1;
            size1.value = Math.floor(currentPanelH * 0.58); x1.value = 34; y1.value = 0;
            size2.value = Math.floor(currentPanelH * 0.42); x2.value = 34; y2.value = Math.floor(currentPanelH * 0.54);
            break;
        case 'mid':
            sizeL.value = Math.floor(currentPanelH * 0.80); xL.value = 2; yL.value = 1;
            size1.value = Math.floor(currentPanelH * 0.48); x1.value = 34; y1.value = 0;
            size2.value = Math.floor(currentPanelH * 0.48); x2.value = 34; y2.value = Math.floor(currentPanelH * 0.49);
            break;
        case 'small':
            sizeL.value = Math.floor(currentPanelH * 0.75); xL.value = 2; yL.value = 2;
            size1.value = Math.floor(currentPanelH * 0.40); x1.value = 34; y1.value = 1;
            size2.value = Math.floor(currentPanelH * 0.40); x2.value = 34; y2.value = Math.floor(currentPanelH * 0.55);
            break;
    }
    drawBuse();
}

function updateSidebarLayerList() {
    const container = document.getElementById('layerListContainer');
    const counter = document.getElementById('layerCount');
    counter.innerText = customRectsArray.length;
    container.innerHTML = '';
    
    if (customRectsArray.length === 0) {
        container.innerHTML = '<div class="no-layers-placeholder">Žádné ruční výplně. Kliknutím na 2 rohy v panelu vytvoříš podklad.</div>';
        return;
    }
    
    customRectsArray.forEach((rect, index) => {
        const item = document.createElement('div');
        item.className = 'layer-item';
        item.innerHTML = `
            <div class="layer-info">
                <div class="layer-color-indicator" style="background:${rect.color}"></div>
                <span><strong>Výplň #${index + 1}</strong> [${rect.xMin},${rect.yMin}]➔[${rect.xMax},${rect.yMax}]</span>
            </div>
            <button class="btn-delete-layer" onclick="deleteSpecificLayer(${index})" title="Odebrat">×</button>
        `;
        container.appendChild(item);
    });
}

function deleteSpecificLayer(index) {
    customRectsArray.splice(index, 1);
    updateSidebarLayerList();
    drawBuse();
}

function drawBuse() {
    const pWidth = parseInt(document.getElementById('pWidth').value) || 140;
    const pHeight = parseInt(document.getElementById('pHeight').value) || 19;
    const globalLedColor = document.getElementById('pColor').value;
    const fillColor = document.getElementById('pFill').value;
    const alphaThreshold = parseInt(document.getElementById('pAlphaThreshold').value) || 25;
    const dotShape = document.getElementById('pDotShape').value; // 'circle' nebo 'square'
    
    document.getElementById('alphaValDisplay').innerText = alphaThreshold;
    document.documentElement.style.setProperty('--buse-color', globalLedColor === '#000000' ? '#ff9d00' : globalLedColor);

    const layersData = [
        {
            val: document.getElementById('lineIn').value,
            font: document.getElementById('lineFont').value,
            size: parseInt(document.getElementById('lineSize').value) || 0,
            x: parseInt(document.getElementById('lineX').value) || 0,
            y: parseInt(document.getElementById('lineY').value) || 0,
            color: document.getElementById('lineColor').value
        },
        {
            val: document.getElementById('textIn1').value,
            font: document.getElementById('text1Font').value,
            size: parseInt(document.getElementById('text1Size').value) || 0,
            x: parseInt(document.getElementById('text1X').value) || 0,
            y: parseInt(document.getElementById('text1Y').value) || 0,
            color: document.getElementById('text1Color').value
        },
        {
            val: document.getElementById('textIn2').value,
            font: document.getElementById('text2Font').value,
            size: parseInt(document.getElementById('text2Size').value) || 0,
            x: parseInt(document.getElementById('text2X').value) || 0,
            y: parseInt(document.getElementById('text2Y').value) || 0,
            color: document.getElementById('text2Color').value
        }
    ];

    mainCanvas.width = pWidth * DOT_RENDER_SIZE;
    mainCanvas.height = pHeight * DOT_RENDER_SIZE;

    // Vykreslení černého/tmavého pozadí desky
    mainCtx.fillStyle = fillColor;
    mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
    
    // Vykreslení neaktivních zhasnutých bodů
    const inactiveHoleColor = calculateGridHoleColor(fillColor);
    for (let x = 0; x < pWidth; x++) {
        for (let y = 0; y < pHeight; y++) {
            drawSingleLedDot(mainCtx, x, y, DOT_RENDER_SIZE, inactiveHoleColor, dotShape, false);
        }
    }

    // Příprava paměťového bufferu pro převod textu na diody
    memoryBuffer.width = pWidth;
    memoryBuffer.height = pHeight;
    memCtx.clearRect(0, 0, pWidth, pHeight);

    layerCanvas.width = pWidth;
    layerCanvas.height = pHeight;

    layersData.forEach((layer) => {
        if (layer.val.trim() !== "" && layer.size > 0) {
            lCtx.clearRect(0, 0, pWidth, pHeight);
            
            drawBuseTextWithCustomSymbols(lCtx, layer.val, layer.x, layer.y, layer.size, layer.font);
            
            lCtx.globalCompositeOperation = 'source-in';
            lCtx.fillStyle = layer.color;
            lCtx.fillRect(0, 0, pWidth, pHeight);
            lCtx.globalCompositeOperation = 'source-over';
            
            memCtx.drawImage(layerCanvas, 0, 0);
        }
    });

    const imgData = memCtx.getImageData(0, 0, pWidth, pHeight).data;
    
    // Procházení matice a vykreslování svítících teček/čtverečků
    for (let x = 0; x < pWidth; x++) {
        for (let y = 0; y < pHeight; y++) {
            const pixelIndex = (y * pWidth + x) * 4;
            const alphaComponent = imgData[pixelIndex + 3];

            if (alphaComponent > alphaThreshold) {
                const r = imgData[pixelIndex];
                const g = imgData[pixelIndex + 1];
                const b = imgData[pixelIndex + 2];
                let finalColor = `rgb(${r},${g},${b})`;

                if (finalColor !== "#000000" && finalColor !== fillColor) {
                    drawSingleLedDot(mainCtx, x, y, DOT_RENDER_SIZE, finalColor, dotShape, true);
                }
            } 
            else {
                let currentActiveRect = null;
                for (let i = customRectsArray.length - 1; i >= 0; i--) {
                    let rce = customRectsArray[i];
                    if (x >= rce.xMin && x <= rce.xMax && y >= rce.yMin && y <= rce.yMax) {
                        currentActiveRect = rce;
                        break;
                    }
                }

                if (currentActiveRect !== null) {
                    drawSingleLedDot(mainCtx, x, y, DOT_RENDER_SIZE, currentActiveRect.color, dotShape, true);
                }
            }
        }
    }

    // Vykreslení značky pro výběr rohu
    if (firstCornerCoords !== null) {
        drawSingleLedDot(mainCtx, firstCornerCoords.x, firstCornerCoords.y, DOT_RENDER_SIZE, "#00ffcc", dotShape, true);
    }
}

mainCanvas.addEventListener('click', function(e) {
    const pWidth = parseInt(document.getElementById('pWidth').value) || 140;
    const pHeight = parseInt(document.getElementById('pHeight').value) || 19;
    
    const boundingBox = mainCanvas.getBoundingClientRect();
    const scaleFactorX = mainCanvas.width / boundingBox.width;
    const scaleFactorY = mainCanvas.height / boundingBox.height;
    
    const calculatedCanvasX = (e.clientX - boundingBox.left) * scaleFactorX;
    const calculatedCanvasY = (e.clientY - boundingBox.top) * scaleFactorY;

    const matrixGridX = Math.floor(calculatedCanvasX / DOT_RENDER_SIZE);
    const matrixGridY = Math.floor(calculatedCanvasY / DOT_RENDER_SIZE);

    if (matrixGridX >= 0 && matrixGridX < pWidth && matrixGridY >= 0 && matrixGridY < pHeight) {
        if (firstCornerCoords === null) {
            firstCornerCoords = { x: matrixGridX, y: matrixGridY };
            document.getElementById('toolStatus').innerText = `📍 Roh 1 uložen [${matrixGridX}, ${matrixGridY}]. Klikni pro Roh 2!`;
            drawBuse();
        } else {
            const xMin = Math.min(firstCornerCoords.x, matrixGridX);
            const xMax = Math.max(firstCornerCoords.x, matrixGridX);
            const yMin = Math.min(firstCornerCoords.y, matrixGridY);
            const yMax = Math.max(firstCornerCoords.y, matrixGridY);
            const selectedFillColor = document.getElementById('pRectColor').value;

            customRectsArray.push({ xMin, xMax, yMin, yMax, color: selectedFillColor });
            firstCornerCoords = null;
            document.getElementById('toolStatus').innerText = `✅ Výplň [${xMin},${yMin}] až [${xMax},${yMax}] uložena.`;
            
            updateSidebarLayerList();
            drawBuse();
        }
    }
});

function clearCustomRects() {
    customRectsArray = [];
    firstCornerCoords = null;
    document.getElementById('toolStatus').innerText = "🧹 Ruční výplně odstraněny.";
    updateSidebarLayerList();
    drawBuse();
}

function exportPNG() {
    const w = document.getElementById('pWidth').value;
    const h = document.getElementById('pHeight').value;
    const shape = document.getElementById('pDotShape').value;
    const anchor = document.createElement('a');
    anchor.download = `SIMT_BUSE_Matrix_${w}x${h}_${shape}.png`;
    anchor.href = mainCanvas.toDataURL("image/png");
    anchor.click();
}

const interactiveInputSelectors = [
    'pWidth', 'pHeight', 'pColor', 'pFill', 'pAlphaThreshold', 'pRectColor', 'pDotShape',
    'lineIn', 'lineFont', 'lineSize', 'lineX', 'lineY', 'lineColor',
    'textIn1', 'text1Font', 'text1Size', 'text1X', 'text1Y', 'text1Color',
    'textIn2', 'text2Font', 'text2Size', 'text2X', 'text2Y', 'text2Color'
];

interactiveInputSelectors.forEach(function(inputId) {
    document.getElementById(inputId).addEventListener('input', function() {
        if (inputId.includes('Size') || inputId.includes('X') || inputId.includes('Y') || inputId.includes('Font')) {
            document.getElementById('pFontCategory').value = 'custom';
        }
        drawBuse();
    });
});

document.getElementById('pColor').addEventListener('input', function() {
    const val = this.value;
    document.getElementById('lineColor').value = val;
    document.getElementById('text1Color').value = val;
    document.getElementById('text2Color').value = val;
    drawBuse();
});

document.getElementById('pFontCategory').addEventListener('change', applyFontPresetCategory);

window.onload = function() {
    drawBuse();
};
</script>
