<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUSE 2-Řádkový Editor Panelu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      margin: 20px;
    }
    .panel-container {
      background: #2b2b2b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
      font-size: 13px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 6px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      box-sizing: border-box;
      border-radius: 4px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    button {
      background: #007acc;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #005999;
    }
    .btn-green { background: #28a745; }
    .btn-green:hover { background: #218838; }
    .btn-orange { background: #fd7e14; }
    .btn-orange:hover { background: #e06b0d; }
    
    canvas {
      border: 2px solid #555;
      background-color: #000;
      margin-top: 15px;
      max-width: 100%;
      image-rendering: pixelated;
    }
    .status-bar {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h2>BUSE 2-Řádkový Editor</h2>

  <div class="panel-container">
    <div class="grid-2col">
      <div>
        <div class="form-group">
          <label>FONT (Speciální sady, např. _OSTRAVA_)</label>
          <input type="text" id="fontTag" value="_OSTRAVA_" placeholder="Zadej např. _OSTRAVA_">
        </div>
        <div class="form-group">
          <label>1. Řádek (Horní)</label>
          <input type="text" id="line1" value="|DPO|">
        </div>
        <div class="form-group">
          <label>2. Řádek (Dolní)</label>
          <input type="text" id="line2" value="VÍTKOVICE">
        </div>
        <div class="form-group">
          <label>Zarovnání textu</label>
          <select id="align">
            <option value="center" selected>Na střed</option>
            <option value="left">Vlevo</option>
            <option value="right">Vpravo</option>
          </select>
        </div>
      </div>

      <div>
        <div class="form-group">
          <label>Nahrát BUSE HEX Písmo (.hex)</label>
          <input type="file" id="hexFile" accept=".hex,.txt">
          <div class="status-bar" id="fontStatus">Aktivní: Výchozí generované písmo</div>
        </div>
        <div class="grid-2col">
          <div class="form-group">
            <label>Šířka (Sloupce)</label>
            <input type="number" id="cols" value="112">
          </div>
          <div class="form-group">
            <label>Výška (Řádky)</label>
            <input type="number" id="rows" value="19">
          </div>
        </div>
        <div class="grid-2col">
          <div class="form-group">
            <label>Barva svitu</label>
            <input type="color" id="colorOn" value="#ffb000" style="width:100%; height:30px; background:none; border:none;">
          </div>
          <div class="form-group">
            <label>Velikost bodu (px)</label>
            <input type="number" id="dotSize" value="3">
          </div>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-green" id="btnExportPng">Exportovat do PNG</button>
      <button class="btn-orange" id="btnSaveJson">Uložit projekt (JSON)</button>
      <button class="btn-orange" onclick="document.getElementById('jsonFile').click()">Načíst projekt (JSON)</button>
      <input type="file" id="jsonFile" accept=".json" style="display:none">
    </div>
  </div>

  <canvas id="buseCanvas"></canvas>

  <script>
    const canvas = document.getElementById('buseCanvas');
    const ctx = canvas.getContext('2d');

    const fontTagInput = document.getElementById('fontTag');
    const line1Input = document.getElementById('line1');
    const line2Input = document.getElementById('line2');
    const alignSelect = document.getElementById('align');
    const colsInput = document.getElementById('cols');
    const rowsInput = document.getElementById('rows');
    const colorOnInput = document.getElementById('colorOn');
    const dotSizeInput = document.getElementById('dotSize');
    const hexFileInput = document.getElementById('hexFile');
    const fontStatus = document.getElementById('fontStatus');

    let customFont = null;

    // Bitový vzor loga DPO přesně odpovídající matrici z obrázku (široký piktogram)
    const DPO_GLYPH = {
      width: 25,
      bitmap: [
        0b00000000, 0b00111100, 0b01111110, 0b01100110, 0b11000011,
        0b11000011, 0b11011011, 0b11011011, 0b01100110, 0b01111110,
        0b00111100, 0b00000000, 0b00111100, 0b01111110, 0b01100110,
        0b11000011, 0b11000011, 0b11011011, 0b11011011, 0b01100110,
        0b01111110, 0b00111100, 0b00000000, 0b00000000, 0b00000000
      ]
    };

    // Vykreslení inverzního loga DPO podle obrázku
    function drawDPOIcon(grid, x, y) {
      // 19 sloupco-řádková kompletní inverzní matice DPO
      const dpoPattern = [
        "1111111111111111111",
        "1111111111111111111",
        "1111111111111111111",
        "1111110111111111111",
        "1111110111111111111",
        "1110000000111111111",
        "1100000000011111111",
        "1000111100001111111",
        "1001111110001111111",
        "1001111110001111111",
        "1000111100001111111",
        "1100000000011111111",
        "1110000000111111111",
        "1111110111111111111",
        "1111110111111111111",
        "1111111111111111111",
        "1111110000000111111",
        "1111100000000011111",
        "1111000111110001111",
        "1111001111111001111",
        "1111001111111001111",
        "1111000111110001111",
        "1111100000000011111",
        "1111110000000111111",
        "1111111111111111111",
        "1111110000000111111",
        "1111100000000011111",
        "1111000111110001111",
        "1111001111111001111",
        "1111001111111001111",
        "1111000111110001111",
        "1111100000000011111",
        "1111110000000111111",
        "1111111111111111111",
        "1111111111111111111"
      ];

      for (let col = 0; col < dpoPattern.length; col++) {
        for (let row = 0; row < dpoPattern[col].length; row++) {
          if (dpoPattern[col][row] === '1') {
            if ((x + col) < grid.length && (y + row) < grid[0].length && (y + row) >= 0) {
              grid[x + col][y + row] = true;
            }
          }
        }
      }
      return dpoPattern.length;
    }

    // Bezpečný Intel HEX Parser
    function parseHexFont(text) {
      const memory = new Uint8Array(65536);
      const lines = text.split(/\r?\n/);
      let loaded = false;

      for (let line of lines) {
        line = line.trim();
        if (!line.startsWith(':')) continue;
        
        const byteCount = parseInt(line.substring(1, 3), 16);
        const address = parseInt(line.substring(3, 7), 16);
        const recordType = parseInt(line.substring(7, 9), 16);

        if (recordType === 0) {
          for (let i = 0; i < byteCount; i++) {
            memory[address + i] = parseInt(line.substring(9 + i * 2, 11 + i * 2), 16);
          }
          loaded = true;
        }
      }

      if (!loaded) throw new Error("Soubor neobsahuje platný Intel HEX formát.");

      const fontData = {};
      for (let c = 32; c <= 255; c++) {
        let offset = 0x80 + (c - 32) * 10;
        let width = memory[offset];
        if (width === 0 || width > 16) width = 5;

        let bitmap = [];
        for (let col = 0; col < width; col++) {
          bitmap.push(memory[offset + 1 + col] || 0);
        }
        fontData[String.fromCharCode(c)] = { width, bitmap };
      }
      return fontData;
    }

    // Vykreslení celé matrice
    function render() {
      const cols = parseInt(colsInput.value) || 112;
      const rows = parseInt(rowsInput.value) || 19;
      const dotSize = parseInt(dotSizeInput.value) || 3;
      const gap = 1;

      canvas.width = cols * (dotSize + gap) + gap;
      canvas.height = rows * (dotSize + gap) + gap;

      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const grid = Array.from({ length: cols }, () => Array(rows).fill(false));

      drawTextOnGrid(grid, line1Input.value, 1, alignSelect.value, cols);
      drawTextOnGrid(grid, line2Input.value, 10, alignSelect.value, cols);

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          const x = gap + c * (dotSize + gap);
          const y = gap + r * (dotSize + gap);
          ctx.fillStyle = grid[c][r] ? colorOnInput.value : '#181200';
          ctx.fillRect(x, y, dotSize, dotSize);
        }
      }
    }

    function tokenizeText(text) {
      const isOstravaFont = fontTagInput.value.trim() === '_OSTRAVA_';
      const tokens = [];
      let i = 0;

      while (i < text.length) {
        if (isOstravaFont && text.substr(i, 5) === '|DPO|') {
          tokens.push({ type: 'DPO' });
          i += 5;
        } else {
          tokens.push({ type: 'char', value: text[i] });
          i++;
        }
      }
      return tokens;
    }

    function drawTextOnGrid(grid, text, startY, align, totalCols) {
      const tokens = tokenizeText(text);
      let totalWidth = 0;

      // Spočítat celkovou šířku textu/ikon
      for (let tok of tokens) {
        if (tok.type === 'DPO') {
          totalWidth += 35 + 1; // Šířka DPO matrice
        } else {
          let char = tok.value;
          if (customFont && customFont[char]) {
            totalWidth += customFont[char].width + 1;
          } else {
            totalWidth += 6;
          }
        }
      }

      let startX = 1;
      if (align === 'center') startX = Math.max(0, Math.floor((totalCols - totalWidth) / 2));
      if (align === 'right') startX = Math.max(0, totalCols - totalWidth - 1);

      let curX = startX;
      for (let tok of tokens) {
        if (curX >= totalCols) break;

        if (tok.type === 'DPO') {
          // DPO logo se roztáhne přes celou výšku matricového panelu (y=0)
          curX += drawDPOIcon(grid, curX, 0) + 1;
        } else {
          let char = tok.value;
          if (customFont && customFont[char]) {
            const g = customFont[char];
            for (let c = 0; c < g.width; c++) {
              if (curX + c >= totalCols) break;
              let byte = g.bitmap[c];
              for (let r = 0; r < 8; r++) {
                if ((byte >> r) & 1 && (startY + r) < grid[0].length) {
                  grid[curX + c][startY + r] = true;
                }
              }
            }
            curX += g.width + 1;
          } else {
            curX += drawFallbackChar(grid, char, curX, startY);
          }
        }
      }
    }

    function drawFallbackChar(grid, char, x, y) {
      const simpleFont = {
        'A': [0x7E, 0x09, 0x09, 0x7E],
        'H': [0x7F, 0x08, 0x08, 0x7F],
        'L': [0x7F, 0x40, 0x40, 0x40],
        'N': [0x7F, 0x04, 0x08, 0x7F],
        'I': [0x41, 0x7F, 0x41],
        ' ': [0x00, 0x00]
      };
      const pattern = simpleFont[char.toUpperCase()] || [0x7F, 0x41, 0x7F];
      for (let c = 0; c < pattern.length; c++) {
        for (let r = 0; r < 8; r++) {
          if ((pattern[c] >> r) & 1 && (x + c) < grid.length && (y + r) < grid[0].length) {
            grid[x + c][y + r] = true;
          }
        }
      }
      return pattern.length + 1;
    }

    // HEX Import Event
    hexFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          customFont = parseHexFont(evt.target.result);
          fontStatus.innerText = "Aktivní: Načteno HEX písmo (" + file.name + ")";
          fontStatus.style.color = "#28a745";
          render();
        } catch (err) {
          alert("Chyba při načítání HEX souboru: " + err.message);
          fontStatus.innerText = "Chyba načtení souboru";
          fontStatus.style.color = "#dc3545";
        }
      };
      reader.readAsText(file);
    });

    // PNG Export
    document.getElementById('btnExportPng').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'buse_panel.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // JSON Export
    document.getElementById('btnSaveJson').addEventListener('click', () => {
      const data = {
        fontTag: fontTagInput.value,
        line1: line1Input.value,
        line2: line2Input.value,
        align: alignSelect.value,
        cols: colsInput.value,
        rows: rowsInput.value,
        colorOn: colorOnInput.value,
        dotSize: dotSizeInput.value
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.download = 'buse_projekt.json';
      link.href = URL.createObjectURL(blob);
      link.click();
    });

    // JSON Import
    document.getElementById('jsonFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = JSON.parse(evt.target.result);
          if (data.fontTag !== undefined) fontTagInput.value = data.fontTag;
          if (data.line1 !== undefined) line1Input.value = data.line1;
          if (data.line2 !== undefined) line2Input.value = data.line2;
          if (data.align !== undefined) alignSelect.value = data.align;
          if (data.cols !== undefined) colsInput.value = data.cols;
          if (data.rows !== undefined) rowsInput.value = data.rows;
          if (data.colorOn !== undefined) colorOnInput.value = data.colorOn;
          if (data.dotSize !== undefined) dotSizeInput.value = data.dotSize;
          render();
        } catch (err) {
          alert("Chyba při načítání JSON projektu: " + err.message);
        }
      };
      reader.readAsText(file);
    });

    // Reakce na vstupy
    [fontTagInput, line1Input, line2Input, alignSelect, colsInput, rowsInput, colorOnInput, dotSizeInput].forEach(el => {
      el.addEventListener('input', render);
    });

    render();
  </script>
</body>
</html>
